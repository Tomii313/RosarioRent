{% load static %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticación</title>
  <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="{% static 'assets/rent.ico' %}" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("{% static 'assets/img/rosario2.jpg' %}") no-repeat center center fixed;
      background-size: cover;
    }

    .login-container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 50px 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      animation: fadeIn 0.7s ease-in-out;
    }

    .login-container h1 {
      text-align: center;
      font-weight: 700;
      margin-bottom: 30px;
      color: #333;
    }

    .form-auth label {
      font-weight: 600;
      margin-bottom: 5px;
      display: block;
      color: #444;
    }

    .form-auth input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }

    .form-auth input:focus {
      border-color: #4facfe;
      box-shadow: 0 0 8px rgba(79, 172, 254, 0.4);
      outline: none;
    }

    .btn-success {
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn-success:hover {
      background: linear-gradient(135deg, #38f9d7, #43e97b);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 249, 215, 0.4);
    }

    .textlogin {
      text-align: center;
      margin-top: 15px;
      color: #333 !important;
    }

    .textlogin a {
      color: #4facfe;
      text-decoration: none;
      font-weight: 600;
    }

    .textlogin a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #fff;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="login-container">
    <form method="post" action="" class="form-auth">
      <h1>Iniciar sesión</h1>
      {% csrf_token %}
      {{ form.as_p }}

      <br>
      <button type="submit" class="btn btn-success">Iniciar Sesión</button>

      <p class="textlogin">¿No tenés una cuenta? <a href="{% url 'autenticacion' %}">Registrarse</a></p>
      <div class="text-center mt-4">
        <p>O iniciar sesión con:</p>
        <a href="{% provider_login_url 'google' %}">
          <img src="{% static 'assets/chrome.png' %}" alt="Google" width="40" style="margin:5px;">
          </a>

      <p class="textlogin"><a href="{% url 'home' %}">Entrar como invitado</a></p>
    </form>

    <div class="footer">
      <p>© 2023 RosarioRent. Todos los derechos reservados.</p>
    </div>
  </div>
</body>
</html>

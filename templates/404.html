{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Error 404 - RentArg</title>
    <link rel="icon" type="image/x-icon" href="{% static 'assets/rent.ico' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Fondo con imagen difuminada */
        body, html {
            height: 100%;
            margin: 0;
        }

        .masthead {
            background: url("{% static 'assets/404.jpg' %}") no-repeat center center/cover;
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        /* Capa oscura para contraste */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            animation: fadeInUp 1s ease-in-out;
        }

        /* Animaciones suaves */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 70px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        h3 {
            font-weight: 400;
            max-width: 800px;
            margin: 0 auto 40px;
            font-size: 22px;
            line-height: 1.5;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.7);
        }

        .btn-custom {
            font-size: 20px;
            font-weight: 600;
            border-radius: 50px;
            padding: 12px 35px;
            margin: 0 15px;
            transition: all 0.3s ease-in-out;
        }

        .btn-success {
            background: #00c853;
            border: none;
        }

        .btn-success:hover {
            background: #00e676;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 230, 118, 0.3);
        }

        .btn-secondary {
            background: #333;
            border: none;
        }

        .btn-secondary:hover {
            background: #555;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        footer {
            position: absolute;
            bottom: 10px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header class="masthead">
        <div class="overlay"></div>
        <div class="content">
            <h1>Ups! Error 404</h1>
            <h3>Parece que la propiedad que buscabas se ha mudado o ya no está disponible.<br>
                Encontremos un nuevo hogar para usted.</h3>
            <div>
                <a href="{% url 'home' %}" class="btn btn-success btn-custom">🏠 Volver al Inicio</a>
                <a href="#" class="btn btn-secondary btn-custom">📞 Contactar</a>
            </div>
        </div>
        <footer>
            &copy; {{ year|default:"2025" }} RentArg — Todos los derechos reservados
        </footer>
    </header>
</body>
</html>

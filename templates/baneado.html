    <style>
        .masthead {
            position: relative;
            background: url("{% static 'assets/img/header-bg.jpg' %}") no-repeat center center;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .masthead::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); /* Oscurece la imagen */
        }
        .profile-card {
            position: relative;
            z-index: 2;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            color: #fff;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .profile-card h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .profile-card p {
            font-size: 1.1rem;
            margin: 8px 0;
            color:rgb(223, 211, 211);
        }
        .profile-card i {
            margin-right: 8px;
            color: #0dcaf0; /* celeste facha */
        }
        .btn-custom {
            margin: 10px;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 30px;
            transition: all 0.3s ease-in-out;
        }
        .btn-custom:hover {
            transform: scale(1.05);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
